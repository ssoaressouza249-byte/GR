name: Build GRX 2X APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ZIP project if uploaded as archive
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Descompactando $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d temp_extract
            if [ -f "temp_extract/settings.gradle.kts" ] || [ -f "temp_extract/settings.gradle" ]; then
              cp -rf temp_extract/* .
              cp -rf temp_extract/.* . 2>/dev/null || true
            else
              SUBDIR=$(find temp_extract -mindepth 1 -maxdepth 1 -type d | head -n 1)
              cp -rf "$SUBDIR"/* .
              cp -rf "$SUBDIR"/.* . 2>/dev/null || true
            fi
            rm -rf temp_extract "$ZIP_FILE"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate missing debug.keystore
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Enforce SDK 36
        run: |
          find . -name "*.gradle.kts" -o -name "*.gradle" | xargs sed -i 's/compileSdk = [0-9]*/compileSdk = 36/g' || true
          find . -name "*.gradle.kts" -o -name "*.gradle" | xargs sed -i 's/targetSdk = [0-9]*/targetSdk = 36/g' || true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GRX-2X-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
